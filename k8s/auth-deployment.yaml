apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: budget-app
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: budget-app/auth:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/jwt/private.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          # The process blocks on a DB connection (with its own internal
          # retry loop, up to ~2 minutes) before it ever binds :8080, so
          # liveness/readiness must not be evaluated until it responds at
          # least once — otherwise Kubernetes kills the container for being
          # slow to start, before its own retry logic gets a chance to work.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            items:
              - key: private.pem
                path: private.pem
                mode: 0444
