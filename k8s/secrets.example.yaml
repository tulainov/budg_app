# Template only — shows the shape of the Secrets the app needs.
# The real file (k8s/secrets.yaml) is generated locally by
# scripts/generate-secrets.sh and is gitignored; it is never committed.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: budget-app
type: Opaque
stringData:
  POSTGRES_USER: budget
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: budgetapp
  database-url: "postgres://budget:REPLACE_ME@postgres:5432/budgetapp"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: budget-app
type: Opaque
stringData:
  private.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_REAL_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
  public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_REAL_PUBLIC_KEY
    -----END PUBLIC KEY-----
